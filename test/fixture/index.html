<!doctype html>
<html><head><meta charset="utf-8"><title>PromptRelay fixture</title>
<style>body{font:14px sans-serif;padding:40px} #prompt-textarea{border:1px solid #888;min-height:60px;width:600px;padding:8px;margin-top:60px}</style></head>
<body>
<div id="prompt-textarea" contenteditable="true" class="ProseMirror"><p><br></p></div>
<button data-testid="send-button" id="send">Send</button>
<script>
  // Capture the closed shadow root so a test can drive the panel.
  const realAttach = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function (init) { const r = realAttach.call(this, { ...init, mode: 'open' }); window.__roots = (window.__roots || []).concat(r); return r; };
  window.sent = [];
  window.stub = { intercept: false, reply: { ok: true, improved: 'Improved: explain TCP.', changes: ['Clarified.'], openQuestions: [], unchanged: false } };
  window.chrome = {
    runtime: { sendMessage: async () => window.stub.reply },
    storage: {
      sync: { get: async () => ({ settings: { sites: { chatgpt: { enabled: true, intercept: window.stub.intercept } } } }) },
      onChanged: { addListener(fn) { window.__onChanged = fn; } },
    },
  };
</script>
<script>
  // Mimic ProseMirror: handle paste itself, one <p> per line; Enter sends.
  const box = document.getElementById('prompt-textarea');
  box.addEventListener('paste', (e) => {
    e.preventDefault();
    const t = e.clipboardData.getData('text/plain');
    box.replaceChildren(...t.split('\n').map((l) => { const p = document.createElement('p'); p.textContent = l; return p; }));
  });
  function doSend() { window.sent.push(box.innerText.trim()); box.innerHTML = '<p><br></p>'; }
  box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); doSend(); } });
  document.getElementById('send').addEventListener('click', doSend);
</script>
<script src="../../src/core/settings.js"></script>
<script src="../../src/core/text.js"></script>
<script src="../../src/core/intercept.js"></script>
<script src="../../src/content/adapters.js"></script>
<script src="../../src/content/ui.js"></script>
<script>
  fetch('../../src/content/content.js').then((r) => r.text()).then((src) => {
    const s = document.createElement('script');
    s.textContent = src.replace('location.hostname', "'chatgpt.com'");
    document.body.append(s);
    window.__ready = true;
  });
</script>
</body></html>
